<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entrada privada | ZR Games</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#163568,#090d18 65%);color:#eaf2ff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{background:#121d31;padding:35px;border:1px solid #354866;border-radius:20px;width:100%;max-width:410px;box-shadow:0 25px 60px #0008}h1{margin:0 0 10px;font-size:25px}.subtitle{color:#a2b2cf;line-height:1.5;margin-bottom:26px}label{font-size:13px;color:#bdd2f3}input{width:100%;padding:14px;border-radius:10px;background:#091221;border:1px solid #394b67;color:white;margin:8px 0 18px}button{width:100%;border:0;padding:14px;border-radius:10px;background:linear-gradient(110deg,#267afa,#3999ff);color:white;font-weight:bold;cursor:pointer}.err{color:#ff9393;min-height:24px;margin-top:15px}a{color:#91c2ff;text-decoration:none;font-size:13px}</style><main class="card"><h1>🔐 Painel privado</h1><p class="subtitle">Acesso exclusivo do administrador da ZR GAMES.</p><form id="form"><label>Senha de administrador</label><input type="password" id="pass" autocomplete="current-password" required placeholder="Sua senha"><button>Entrar no painel</button></form><p class="err" id="err"></p><a href="/">← Voltar para os jogos</a></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const key=document.getElementById('pass').value;try{const r=await fetch('/api/games?check=admin',{headers:{'x-admin-key':key}});if(!r.ok)throw Error();sessionStorage.setItem('zr_admin_key',key);location.replace('/admin')}catch{document.getElementById('err').textContent='Acesso não autorizado.';setTimeout(()=>location.replace('/'),1600)}}</script></html>
