<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080b10"><title>ZR GAMES — Biblioteca de jogos</title><style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:#080b10;color:#fff;font-family:Outfit,Arial,sans-serif;margin:0}body.lock{overflow:hidden}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.top{height:73px;display:flex;align-items:center;justify-content:space-between;gap:25px;padding:0 5%;position:sticky;top:0;z-index:20;background:#080b10f0;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.logo{font-size:25px;font-weight:900;letter-spacing:-1.2px}.logo span{color:#348cff}.nav{display:flex;gap:26px;align-items:center;font-size:14px;color:#c3ccd9}.nav a:hover{color:#55a0ff}.search{background:#171d28;border:1px solid #303849;border-radius:8px;color:#fff;outline:0;padding:11px 15px;width:min(280px,32vw)}.search:focus{border-color:#448fff}.hero{min-height:370px;padding:65px 6% 65px;display:flex;align-items:center;background:radial-gradient(ellipse 65% 100% at 85% 40%,#1d427765,transparent 80%),linear-gradient(135deg,#111b2d,#080b10)}.hero>div{max-width:650px}.eyebrow{color:#64a9ff;font-size:12px;font-weight:800;letter-spacing:3px}.hero h1{font-size:clamp(40px,5.7vw,70px);line-height:1.06;letter-spacing:-2.4px;margin:15px 0}.hero h1 em{color:#4a9bff;font-style:normal}.hero p{color:#adb9cd;font-size:16px;line-height:1.65;max-width:560px}.ghost{background:#fff;color:#121924;border:0;padding:13px 23px;border-radius:8px;font-weight:800;margin-top:12px}.shell{padding:20px 0 90px}.section{padding:16px 0 20px}.section h2{margin:0 5% 17px;font-size:23px;font-weight:800;letter-spacing:-.4px}.section h2 small{color:#5aa0f5;font-size:13px;font-weight:500;margin-left:9px}.rail{display:flex;gap:15px;overflow-x:auto;padding:0 5% 17px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#2c3b53 transparent}.tile{width:205px;min-width:205px;scroll-snap-align:start;text-align:left;background:#141a25;border:1px solid #232c3e;border-radius:11px;overflow:hidden;color:#fff;transition:transform .2s,border-color .2s;display:block;padding:0}.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:#519cff;outline:none}.poster{width:100%;height:260px;object-fit:cover;display:block;background:linear-gradient(135deg,#1d3050,#101724)}.tileinfo{padding:13px}.tile strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{display:block;color:#94a4bf;margin-top:4px;font-size:12px}.empty{margin:20px 5%;padding:58px 20px;border:1px dashed #324059;border-radius:12px;text-align:center;color:#aebbd0}.foot{border-top:1px solid #242c39;color:#7f8da5;padding:30px 5%;font-size:13px;display:flex;justify-content:space-between;gap:15px}.foot a{opacity:.5}.overlay{position:fixed;inset:0;background:#000c;z-index:50;display:none;place-items:center;padding:22px;backdrop-filter:blur(5px)}.overlay.show{display:grid}.dialog{width:min(760px,100%);max-height:92vh;overflow:auto;background:#171c27;border-radius:15px;box-shadow:0 35px 110px #000b;position:relative}.dialog-hero{height:320px;background:#1f2c40;position:relative}.dialog-hero img{height:100%;width:100%;object-fit:cover;display:block}.dialog-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#171c27,transparent 80%)}.close{position:absolute;right:17px;top:17px;border:1px solid #ffffff36;background:#080c12c9;width:37px;height:37px;border-radius:50%;color:#fff;font-size:23px;z-index:2}.detail{padding:0 33px 35px;margin-top:-55px;position:relative;z-index:1}.detail h2{font-size:36px;margin:0 0 12px;line-height:1.1}.detailmeta{color:#70b0ff;font-size:13px;display:flex;flex-wrap:wrap;gap:15px;margin-bottom:16px}.detail p{color:#c5cedd;line-height:1.7;font-size:15px}.download{display:inline-flex;align-items:center;justify-content:center;padding:14px 34px;border-radius:8px;background:#2686ff;color:#fff;font-size:14px;font-weight:900;letter-spacing:1px;box-shadow:0 9px 26px #1766cd55;margin-top:14px}.download:hover{background:#4b9dff}@media(max-width:650px){.top{gap:8px;padding:0 4%;height:65px}.logo{font-size:20px}.nav{display:none}.search{width:45vw;font-size:12px}.hero{min-height:280px;padding:45px 5%}.hero h1{font-size:38px}.hero p{font-size:14px}.section h2{margin-left:5%;font-size:20px}.tile{min-width:145px;width:145px}.poster{height:190px}.dialog-hero{height:240px}.detail{padding:0 20px 27px}.detail h2{font-size:28px}.foot{font-size:11px}}</style></head><body>
<header class="top"><a href="/" class="logo">ZR<span>GAMES</span>.</a><nav class="nav"><a href="#catalog">Jogos</a><a href="#categorias">Categorias</a></nav><input class="search" id="search" aria-label="Buscar jogos" placeholder="⌕  Buscar jogo..."></header>
<section class="hero"><div><span class="eyebrow">✦ BEM-VINDO À SUA BIBLIOTECA</span><h1>Escolha. Baixe.<br><em>Comece a jogar.</em></h1><p>Explore jogos por categoria. Clique na capa para ver a história, detalhes e o link de download.</p><button class="ghost" onclick="document.getElementById('catalog').scrollIntoView()">▶ Explorar jogos</button></div></section>
<main class="shell" id="catalog"><div id="categorias"><div class="empty">Carregando catálogo...</div></div></main>
<footer class="foot"><span>© 2026 ZR GAMES • Biblioteca de games</span><a href="/admin-login.html" aria-label="Acesso administrativo">⚙</a></footer>
<div id="overlay" class="overlay" role="presentation"><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailtitle" tabindex="-1"><button id="close" class="close" aria-label="Fechar">×</button><div class="dialog-hero"><img id="detailimage" alt="Capa do jogo"></div><div class="detail"><h2 id="detailtitle"></h2><div id="detailmeta" class="detailmeta"></div><p id="detaildesc"></p><a id="detaildownload" class="download" target="_blank" rel="noopener noreferrer">↓ &nbsp; BAIXAR</a></div></div></div>
<script>
let games=[];const categories=document.getElementById('categorias'),overlay=document.getElementById('overlay'),dialog=document.getElementById('dialog'),search=document.getElementById('search');let lastFocus=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};const category=g=>String(g.genre||'Outros').trim()||'Outros';
function render(){const term=search.value.toLocaleLowerCase('pt-BR').trim();const filtered=games.filter(g=>(g.title+' '+g.genre+' '+g.description).toLocaleLowerCase('pt-BR').includes(term));if(!filtered.length){categories.innerHTML='<div class="empty">'+(term?'Nenhum jogo encontrado para sua pesquisa.':'Nenhum jogo publicado ainda. A biblioteca está sendo preparada.')+'</div>';return}const names=[...new Set(filtered.map(category))].sort((a,b)=>a.localeCompare(b,'pt-BR'));categories.innerHTML=names.map(name=>{const items=filtered.filter(g=>category(g)===name);return '<section class="section"><h2>'+esc(name)+' <small>'+items.length+' jogo'+(items.length===1?'':'s')+'</small></h2><div class="rail">'+items.map(g=>'<button class="tile" data-id="'+esc(g.id)+'" aria-label="Ver detalhes de '+esc(g.title)+'"><img class="poster" loading="lazy" src="'+esc(url(g.image))+'" alt="Capa de '+esc(g.title)+'"><div class="tileinfo"><strong>'+esc(g.title)+'</strong><small>Ver detalhes e baixar ↗</small></div></button>').join('')+'</div></section>'}).join('');categories.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openGame(el.dataset.id)))}
function openGame(id){let g=games.find(v=>String(v.id)===id);if(!g)return;lastFocus=document.activeElement;document.getElementById('detailtitle').textContent=g.title||'Jogo';document.getElementById('detailimage').src=url(g.image);document.getElementById('detailimage').alt='Capa de '+g.title;document.getElementById('detaildesc').textContent=g.description||'Descubra este jogo e comece sua próxima aventura.';document.getElementById('detailmeta').textContent=[category(g),g.size||'Download disponível'].join('  •  ');document.getElementById('detaildownload').href=url(g.download);overlay.classList.add('show');document.body.classList.add('lock');document.getElementById('close').focus()}
function closeGame(){overlay.classList.remove('show');document.body.classList.remove('lock');lastFocus?.focus()}document.getElementById('close').onclick=closeGame;overlay.addEventListener('click',e=>{if(e.target===overlay)closeGame()});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('show'))return;if(e.key==='Escape')closeGame();if(e.key==='Tab'){let focusables=[...dialog.querySelectorAll('button,a[href]')];let first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});search.addEventListener('input',render);fetch('/api/games').then(r=>{if(!r.ok)throw Error('API');return r.json()}).then(d=>{games=Array.isArray(d)?d:[];render()}).catch(()=>{categories.innerHTML='<div class="empty">Não foi possível carregar os jogos. Tente novamente mais tarde.</div>'});
</script></body></html>
