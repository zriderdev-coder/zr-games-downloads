<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#040c16"><title>ZR GAMES — Biblioteca de jogos</title><style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');
:root{color-scheme:dark;font-family:Outfit,Arial,sans-serif;background:#040b14;color:#f6f8ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:66px;display:flex;align-items:center;gap:42px;padding:0 5%;border-bottom:1px solid #1c3654;background:#050c15}.logo{font-size:25px;font-weight:900;letter-spacing:-1.2px}.logo b{color:#3298ff}.links{display:flex;gap:25px;margin:auto;font-size:13px}.links a:hover{color:#35a2ff}.search{background:#112139;border:1px solid #263e60;color:#d8e9ff;border-radius:9px;padding:12px 15px;width:230px;outline:0;font-size:13px}.search:focus{border-color:#409cff}
.hero{position:relative;min-height:325px;overflow:hidden;display:flex;align-items:center;padding:35px 5%;background:radial-gradient(ellipse at 77% 50%,#1a477c 0%,#07192c 56%,#07101c 96%)}.hero-back{position:absolute;inset:0;background-size:cover;background-position:center 35%;opacity:.62;transition:background-image .3s}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#061120 0%,#061120f5 27%,#06112068 62%,#08101b35 100%)}.hero-copy{position:relative;z-index:2;max-width:620px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:3px;color:#39a2ff}.hero h1{font-size:clamp(38px,4.3vw,67px);line-height:.98;letter-spacing:-2px;margin:14px 0}.hero h1 em{font-style:normal;color:#3b9fff}.hero p{font-size:14px;line-height:1.5;color:#d0dbeb;max-width:510px}.heroBtn{border:0;background:#fff;color:#17263a;border-radius:8px;font-weight:800;padding:12px 22px;margin-top:3px}.arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);border-radius:50%;width:45px;height:45px;background:#08111bba;border:1px solid #758dac66;color:#fff;font-size:26px}.arrow.prev{left:44%}.arrow.next{right:2%}.dots{position:absolute;right:5%;bottom:13px;z-index:3;display:flex;gap:7px}.dots button{width:8px;height:8px;border-radius:30px;border:0;background:#7084a0}.dots button.active{background:#249cff;width:20px}.hero-title{position:absolute;right:5%;bottom:35px;z-index:2;text-align:right;text-shadow:0 2px 14px #000}.hero-title b{font-size:32px;letter-spacing:3px}.hero-title small{display:block;letter-spacing:4px;color:#b9d8ff}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #1a324e}.category{min-width:0;padding:16px 16px 18px 2.1%;border-bottom:1px solid #21364e}.category:nth-child(odd){border-right:1px solid #20374d}.cathead{display:flex;align-items:center;gap:13px;margin:0 0 12px}.cathead .emoji{font-size:22px}.cathead h2{font-size:19px;margin:0;font-weight:800}.cathead p{font-size:11px;color:#8db9e9;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewall{margin-left:auto;background:transparent;border:0;color:#35aaff;font-size:12px;font-weight:800;white-space:nowrap}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(105px,1fr);gap:10px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#1d4269 transparent;padding-bottom:3px}.tile{position:relative;display:flex;align-items:stretch;justify-content:end;flex-direction:column;min-height:232px;overflow:hidden;text-align:center;background:#111e30;border:1px solid #254360;border-radius:8px;color:white;padding:0;isolation:isolate}.tile::after{content:"";z-index:-1;position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#020812 93%)}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .25s}.tile:hover img{transform:scale(1.08)}.tile:hover{border-color:#5eaeff}.tile strong{font-size:12px;font-weight:900;line-height:1.05;text-shadow:0 2px 5px #000;letter-spacing:.2px;padding:0 4px 9px}.tile .details{align-self:center;border:1px solid #47688d;background:#0b1b30cf;border-radius:22px;padding:5px 12px;font-size:10px;margin-bottom:9px;white-space:nowrap}.tile.wide{min-height:165px}.tile.wide strong{font-size:13px}.tile.wide img{object-position:center}.empty{padding:50px;text-align:center;color:#94accd}.foot{border-top:1px solid #20364d;padding:26px 5%;font-size:12px;color:#859cb9;display:flex;justify-content:space-between}.foot a{opacity:.65}
.modal{position:fixed;inset:0;background:#000c;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(7px)}.modal.on{display:flex}body.lock{overflow:hidden}.dialog{max-height:92vh;overflow:auto;width:min(820px,100%);background:#101c2e;border:1px solid #395473;border-radius:16px;position:relative;box-shadow:0 25px 100px #000d}.dialogCover{height:330px;background:#142640;position:relative}.dialogCover img{height:100%;width:100%;object-fit:cover}.dialogCover:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#101c2e,transparent 90%)}.close{position:absolute;right:16px;top:16px;z-index:2;border:0;border-radius:50%;width:39px;height:39px;color:white;background:#08111dd9;font-size:25px}.dialogInfo{padding:0 35px 35px;position:relative;margin-top:-25px}.dialogInfo h2{font-size:36px;margin:0 0 12px}.dialogInfo p{color:#b8c9df;line-height:1.7}.tags{font-size:13px;color:#55a8ff;font-weight:700}.download{display:inline-block;margin-top:12px;border-radius:9px;background:linear-gradient(110deg,#1476ec,#40a2ff);padding:15px 34px;font-size:14px;font-weight:900;letter-spacing:1px}
@media(max-width:1000px){.categories{display:block}.category:nth-child(odd){border-right:0}.rail{grid-auto-columns:155px}.tile{min-height:240px}.tile.wide{min-height:190px}.arrow.prev{left:auto;right:65px}.arrow.next{right:12px}.hero-title{display:none}}@media(max-width:600px){.top{height:60px;padding:0 4%;gap:9px}.logo{font-size:20px}.links{display:none}.search{margin-left:auto;width:47%;font-size:12px}.hero{min-height:295px;padding:28px 5%}.hero h1{font-size:41px}.hero p{font-size:13px}.arrow{top:auto;bottom:12px;width:32px;height:32px;font-size:19px}.arrow.prev{right:52px}.arrow.next{right:12px}.dots{right:auto;left:5%}.category{padding:15px 3%}.cathead{gap:8px}.cathead h2{font-size:17px}.cathead p{display:none}.rail{grid-auto-columns:132px}.tile{min-height:210px}.tile.wide{min-height:160px}.dialogCover{height:240px}.dialogInfo{padding:0 20px 25px}.dialogInfo h2{font-size:28px}}
</style></head><body><header class="top"><a href="/" class="logo">ZR<b>GAMES</b>.</a><nav class="links"><a href="#jogos">Jogos</a><a href="#jogos">Categorias</a></nav><input id="search" class="search" placeholder="⌕  Buscar jogo..." aria-label="Buscar jogo"></header><section class="hero"><div class="hero-back" id="heroBack"></div><div class="hero-copy"><span class="eyebrow">★ BEM-VINDO À SUA BIBLIOTECA</span><h1>Escolha. Baixe.<br><em>Comece a jogar.</em></h1><p>Explore jogos por categoria. Clique na capa para ver a história, detalhes e o link de download.</p><button class="heroBtn" id="explore">▶ Explorar jogos</button></div><button class="arrow prev" id="prev" aria-label="Banner anterior">‹</button><button class="arrow next" id="next" aria-label="Próximo banner">›</button><div class="hero-title" id="heroTitle"></div><div class="dots" id="dots"></div></section><main class="categories" id="jogos"></main><footer class="foot"><span>© 2026 ZR GAMES — Sua biblioteca de games</span><a href="/admin-login.html">⚙ Admin</a></footer><div class="modal" id="modal"><div role="dialog" aria-modal="true" aria-labelledby="gameTitle" class="dialog" id="dialog"><button class="close" id="close" aria-label="Fechar">×</button><div class="dialogCover"><img id="gameImage" alt=""></div><div class="dialogInfo"><h2 id="gameTitle"></h2><div class="tags" id="gameMeta"></div><p id="gameDesc"></p><a class="download" target="_blank" rel="noopener noreferrer" id="download">↓ &nbsp; BAIXAR</a><p id="official" style="font-size:12px;color:#8fa4c3"></p></div></div></div><script>
const catalog=[
[ 'Ação','⚔️','Adrenalina, combate e muita ação!',[
['Counter-Strike 2',730],['Warframe',230410],['PUBG: BATTLEGROUNDS',578080],['THE FINALS',2073850],['Destiny 2',1085660],['Once Human',2139460]]],
['Corrida','🏎️','Velocidade, competição e emoção nas pistas!',[
['Trackmania',2225070],['Asphalt Legends',1815780],['RaceRoom Racing Experience',211500],['KartRider: Drift',1184140],['Disney Speedstorm',1537830],['Torque Drift',1029550]]],
['Terror','💀','Enfrente seus medos.',[
['SCP: Secret Laboratory',700330],['Cry of Fear',223710],['No More Room in Hell',224260],['Unturned',304930],['Deceit',466240],['SCP: Containment Breach Multiplayer',1782380]]],
['Aventura','🗺️','Explore mundos incríveis.',[
['Palia',2707930],['Sky: Children of the Light',2325290],['Creativerse',280790],['Guild Wars 2',1284210],['The Lord of the Rings Online',212500],['RuneScape',1343400]]],
['Multiplayer','👥','Jogue com amigos e com o mundo todo.',[
['Apex Legends',1172470],['Dota 2',570],['Brawlhalla',291550],['War Thunder',236390],['World of Tanks Blitz',444200],['Goose Goose Duck',1568590]]]
];
const sample=catalog.flatMap(([genre,icon,blurb,items])=>items.map(([title,appid])=>({id:'demo-'+appid,title,genre,description:'Conheça '+title+'. Explore este jogo e confira mais informações na página oficial. Os jogos de demonstração direcionam para suas páginas oficiais.',image:'https://cdn.cloudflare.steamstatic.com/steam/apps/'+appid+'/library_600x900.jpg',fallback:'https://cdn.cloudflare.steamstatic.com/steam/apps/'+appid+'/header.jpg',download:'https://store.steampowered.com/app/'+appid+'/',size:'Página oficial',demo:true})));
let items=[],slide=0,lastFocus=null;const main=document.getElementById('jogos'),modal=document.getElementById('modal');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};
function groups(){const names=[...new Set(items.map(g=>g.genre||'Outros'))];const ordered=[...catalog.map(c=>c[0]).filter(n=>names.includes(n)),...names.filter(n=>!catalog.some(c=>c[0]===n))];return ordered.map(n=>({name:n, icon:catalog.find(c=>c[0]===n)?.[1]||'🎮',blurb:catalog.find(c=>c[0]===n)?.[2]||'Escolha seu próximo jogo.',games:items.filter(g=>(g.genre||'Outros')===n)}))}
function render(){const q=document.getElementById('search').value.toLocaleLowerCase('pt-BR').trim();const sections=groups().map(g=>({...g,games:g.games.filter(x=>(x.title+' '+x.description+' '+x.genre).toLocaleLowerCase('pt-BR').includes(q))})).filter(g=>g.games.length);main.innerHTML=sections.length?sections.map((g,i)=>'<section class="category"><div class="cathead"><span class="emoji">'+g.icon+'</span><h2>'+esc(g.name)+'</h2><p>'+esc(g.blurb)+'</p><button class="viewall" data-category="'+esc(g.name)+'">Ver todos →</button></div><div class="rail">'+g.games.map(x=>'<button class="tile'+(g.name==='Multiplayer'?' wide':'')+'" data-id="'+esc(x.id)+'"><img loading="lazy" src="'+esc(safe(x.image))+'" data-fallback="'+esc(safe(x.fallback||''))+'" alt="Capa de '+esc(x.title)+'"><strong>'+esc(x.title)+'</strong><span class="details">Ver detalhes</span></button>').join('')+'</div></section>').join(''):'<div class="empty">Nenhum jogo encontrado.</div>';main.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openGame(x.dataset.id));main.querySelectorAll('img[data-fallback]').forEach(x=>x.onerror=()=>{let f=x.dataset.fallback;if(f&&f!=='#'&&x.src!==f){x.onerror=null;x.src=f}});main.querySelectorAll('[data-category]').forEach(x=>x.onclick=()=>{document.getElementById('search').value=x.dataset.category;render();main.scrollIntoView({behavior:'smooth'})})}
function openGame(id){const g=items.find(x=>String(x.id)===id);if(!g)return;lastFocus=document.activeElement;document.getElementById('gameImage').src=safe(g.fallback||g.image);document.getElementById('gameTitle').textContent=g.title;document.getElementById('gameMeta').textContent=[g.genre,g.size].filter(Boolean).join(' • ');document.getElementById('gameDesc').textContent=g.description||'Veja mais informações sobre este jogo.';document.getElementById('download').href=safe(g.download);document.getElementById('official').textContent=g.demo?'Jogo de exemplo: este botão abre a página oficial.':'O download será aberto em uma nova guia.';modal.classList.add('on');document.body.classList.add('lock');document.getElementById('close').focus()}
function close(){modal.classList.remove('on');document.body.classList.remove('lock');lastFocus?.focus()}document.getElementById('close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(!modal.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='Tab'){const f=[...document.getElementById('dialog').querySelectorAll('button,a[href]')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
function hero(){const featured=items.slice(0,5);if(!featured.length)return;slide=(slide+featured.length)%featured.length;const g=featured[slide];document.getElementById('heroBack').style.backgroundImage='url("'+safe(g.fallback||g.image).replace(/"/g,'%22')+'")';document.getElementById('heroTitle').innerHTML='<b>'+esc(g.title.toUpperCase())+'</b><small>DESCUBRA SUA PRÓXIMA AVENTURA</small>';document.getElementById('dots').innerHTML=featured.map((_,i)=>'<button aria-label="Banner '+(i+1)+'" data-slide="'+i+'" class="'+(i===slide?'active':'')+'"></button>').join('');document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{slide=Number(b.dataset.slide);hero()})}
document.getElementById('prev').onclick=()=>{slide--;hero()};document.getElementById('next').onclick=()=>{slide++;hero()};document.getElementById('explore').onclick=()=>main.scrollIntoView({behavior:'smooth'});document.getElementById('search').oninput=render;
fetch('/api/games').then(r=>r.ok?r.json():[]).then(g=>{items=Array.isArray(g)&&g.length?g:sample;render();hero()}).catch(()=>{items=sample;render();hero()});
</script></body></html>
