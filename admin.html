<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel Admin | ZR Games</title><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#090d18;color:#edf2ff;font-family:Outfit,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#80b7ff;text-decoration:none}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginCard,.panel{background:#121b2b;border:1px solid #2d3b54;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0005}.loginCard{width:min(420px,100%)}.logo{font-weight:900;font-size:27px}.logo span{color:#378dfc}h1{margin:10px 0;font-size:30px}.sub{color:#9baac2;line-height:1.6}label{display:block;font-weight:600;font-size:13px;margin:18px 0 7px}input,textarea{width:100%;border:1px solid #33425d;background:#0b1321;color:#f1f5ff;border-radius:10px;padding:12px;outline:0}input:focus,textarea:focus{border-color:#458fff}textarea{resize:vertical;min-height:90px}.btn{background:linear-gradient(105deg,#2477f3,#3697ff);color:white;font-weight:800;padding:12px 17px;border:0;border-radius:10px}.muted{color:#8190ac}.error{color:#ff9292}.shell{max-width:1160px;margin:auto;padding:28px 22px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:32px}.barActions{display:flex;gap:12px;align-items:center}.bar button{background:#25324a;border:1px solid #3d4b62;color:white;border-radius:10px;padding:10px 15px}.layout{display:grid;grid-template-columns:420px 1fr;gap:25px}.panel h2{margin:0;font-size:23px}.list{display:grid;gap:13px;margin-top:20px}.item{border:1px solid #2b3b55;border-radius:12px;padding:12px;display:flex;gap:13px;align-items:center}.item img{width:76px;height:68px;border-radius:8px;object-fit:cover;background:#1b263a}.item strong{display:block}.item small{color:#8294b0}.actions{margin-left:auto;display:flex;gap:6px}.actions button{background:#25334b;border:0;color:#dbe8ff;border-radius:8px;padding:9px}.actions button.del{color:#ff9494}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}.status{margin:12px 0;font-size:13px;min-height:22px}@media(max-width:850px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.wide{grid-column:auto}} .lookup{background:#0c1627;border:1px solid #29466d;border-radius:14px;padding:17px;margin:22px 0}.lookuprow{display:flex;gap:8px;margin-top:10px}.lookuprow input{flex:1;min-width:0}.results{display:grid;gap:8px;max-height:290px;overflow:auto;margin-top:10px}.result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#14243b;border:1px solid #2d4463;color:white;border-radius:9px;padding:8px}.result:hover{border-color:#3696ff}.result img{width:80px;height:45px;object-fit:cover;border-radius:5px}.hint{font-size:12px;color:#9fb4d2;line-height:1.5}@media(max-width:500px){.lookuprow{flex-direction:column}}</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let key=sessionStorage.getItem('zr_admin_key')||'',games=[],editing=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method='GET',url='/api/games',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro '+r.status);return d}
function goHome(){sessionStorage.removeItem('zr_admin_key');location.replace('/')}
async function boot(){if(!key){goHome();return}try{await api('GET','/api/games?check=admin');renderAdmin();refresh()}catch{goHome()}}
function renderAdmin(){app.innerHTML='<div class="shell"><div class="bar"><div class="logo">ZR<span>GAMES</span> <span style="font-size:14px;color:#91a3c2">/ ADMIN</span></div><div class="barActions"><a href="/">Ver site ↗</a><button id="logout">Sair</button></div></div><div class="layout"><div class="panel"><h2 id="formTitle">Adicionar jogo</h2><p class="sub">Cadastre uma capa e o link de download para publicar na loja.</p><div class="lookup"><strong>🔎 Buscar jogo automaticamente</strong><p class="hint">Digite o nome do jogo, inclusive lançamentos recentes. Selecione um resultado para importar capa, categoria e descrição. Você pode editar tudo depois.</p><div class="lookuprow"><input id="lookup" placeholder="Ex: Hollow Knight" autocomplete="off"><button type="button" class="btn" id="findGame">Pesquisar</button></div><div class="results" id="results"></div></div><form id="form"><div class="fields"><div class="wide"><label>Nome do jogo *</label><input id="title" required maxlength="90" placeholder="Ex: Meu jogo de aventura"></div><div><label>Categoria</label><input id="genre" placeholder="Ação, RPG, Corrida..."></div><div><label>Tamanho</label><input id="size" placeholder="Ex: 2.4 GB"></div><div class="wide"><label>URL da imagem de capa *</label><input id="image" type="url" required placeholder="https://site.com/capa.jpg"></div><div class="wide"><label>Link do download *</label><input id="download" type="url" required placeholder="https://site.com/arquivo.zip"></div><div class="wide"><label>Descrição</label><textarea id="description" maxlength="500" placeholder="Sobre o jogo..."></textarea></div></div><p id="status" class="status muted"></p><button class="btn" id="save">+ Publicar jogo</button> <button type="button" id="cancel" style="display:none;background:none;color:#a5b4ca;border:0">Cancelar edição</button></form></div><div class="panel"><h2>Jogos publicados <span id="count" class="muted"></span></h2><p class="sub">Gerencie seu catálogo em tempo real.</p><div class="list" id="list">Carregando...</div></div></div></div>';document.getElementById('logout').onclick=goHome;document.getElementById('cancel').onclick=reset;document.getElementById('form').onsubmit=save;document.getElementById('findGame').onclick=lookup;document.getElementById('lookup').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();lookup()}}}
async function refresh(){try{games=await api();document.getElementById('count').textContent='('+games.length+')';document.getElementById('list').innerHTML=games.length?games.map(g=>'<div class="item"><img src="'+esc(g.image)+'" alt=""><div><strong>'+esc(g.title)+'</strong><small>'+esc(g.genre||'Jogo')+'</small></div><div class="actions"><button data-edit="'+esc(g.id)+'">Editar</button><button class="del" data-delete="'+esc(g.id)+'">Excluir</button></div></div>').join(''):'<p class="muted">Nenhum jogo cadastrado ainda.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}catch(e){document.getElementById('list').textContent=e.message}}
function edit(id){const g=games.find(x=>x.id===id);if(!g)return;editing=id;for(const f of ['title','genre','size','image','download','description'])document.getElementById(f).value=g[f]||'';document.getElementById('formTitle').textContent='Editar jogo';document.getElementById('save').textContent='Salvar alterações';document.getElementById('cancel').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}
function reset(){editing=null;document.getElementById('form').reset();document.getElementById('formTitle').textContent='Adicionar jogo';document.getElementById('save').textContent='+ Publicar jogo';document.getElementById('cancel').style.display='none'}
async function save(e){e.preventDefault();const s=document.getElementById('status'),b=document.getElementById('save');b.disabled=true;s.textContent='Salvando...';try{const body={};for(const f of ['title','genre','size','image','download','description'])body[f]=document.getElementById(f).value.trim();if(editing)body.id=editing;await api('POST','/api/games',body);reset();s.textContent='✓ Jogo publicado com sucesso!';refresh()}catch(e){s.textContent='Erro: '+e.message;s.className='status error'}finally{b.disabled=false}}
async function remove(id){if(!confirm('Excluir este jogo do catálogo?'))return;try{await api('DELETE','/api/games?id='+encodeURIComponent(id));refresh()}catch(e){alert(e.message)}}
async function lookup(){const q=document.getElementById('lookup').value.trim(),out=document.getElementById('results');if(q.length<2){out.textContent='Digite pelo menos duas letras.';return}out.textContent='Buscando...';try{const d=await api('GET','/api/search?q='+encodeURIComponent(q));const rows=d.items||[];out.innerHTML=rows.length?rows.map(x=>'<button type="button" class="result" data-steamid="'+esc(x.id)+'"><img src="'+esc(x.image)+'" alt=""><span>'+esc(x.title)+'</span></button>').join(''):'Nenhum resultado encontrado.';out.querySelectorAll('[data-steamid]').forEach(b=>b.onclick=()=>importGame(b.dataset.steamid))}catch(e){out.textContent=e.message}}
async function importGame(id){const out=document.getElementById('results');out.textContent='Importando dados...';try{const g=await api('GET','/api/search?id='+encodeURIComponent(id));for(const field of ['title','description','image','genre'])document.getElementById(field).value=g[field]||'';document.getElementById('size').value='';out.textContent='✓ Dados preenchidos. Edite o que quiser e informe o link de download antes de publicar.';document.getElementById('download').focus()}catch(e){out.textContent=e.message}}
boot();
</script></body></html>
